name: Supervisor demo
on: [push, pull_request]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: pwsh
        run: ./scripts/verify.ps1
  cross:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
      - run: go build ./...
